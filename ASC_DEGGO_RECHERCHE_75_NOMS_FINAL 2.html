<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1010e8">
<title>ASC-DEGGO • Recherche cotisants</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#111820;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,#0505a9,#1818ee);color:#fff;padding:16px;box-shadow:0 3px 12px #0003}
.head{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{width:62px;height:62px;border-radius:12px;background:#fff;object-fit:contain;padding:3px}
h1{font-size:21px;line-height:1.1;margin:0;font-weight:850} .sub{font-size:13px;margin-top:5px;opacity:.92}
.wrap{max-width:760px;margin:auto;padding:14px}
.searchPanel{position:sticky;top:0;z-index:5;background:#f3f5f8;padding:4px 0 10px}
.search{display:flex;gap:8px}
#q{flex:1;min-width:0;border:2px solid #d6dce3;border-radius:14px;padding:14px 14px 14px 43px;font-size:17px;outline:none;background:#fff}
#q:focus{border-color:#1010e8;box-shadow:0 0 0 3px #1010e820}
.searchBox{position:relative;flex:1} .icon{position:absolute;left:14px;top:11px;font-size:22px;z-index:1}
.btn{border:0;border-radius:14px;padding:0 17px;background:#1010e8;color:#fff;font-size:16px;font-weight:800}
.count{display:flex;justify-content:space-between;color:#68727a;font-size:13px;margin:4px 2px 10px}
.card{background:#fff;border-radius:15px;padding:15px;margin-bottom:9px;box-shadow:0 2px 10px #0000000b;border-left:4px solid #1010e8}
.name{font-weight:850;font-size:17px} .cat{margin-top:5px;color:#1010e8;font-weight:750;font-size:13px}
.details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #edf0f3}
.card.open .details{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.box{background:#f7f9fb;border-radius:10px;padding:10px} .lbl{font-size:11px;color:#68727a} .val{font-weight:850;margin-top:3px}
.month{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px solid #edf0f3}
.month:last-child{border-bottom:0}
.empty{background:#fff;border-radius:15px;text-align:center;padding:28px;color:#68727a}
.hint{background:#fff;border-radius:14px;padding:13px;margin:10px 0;color:#53606a;font-size:13px}
@media(max-width:420px){.btn{padding:0 13px}}
</style>
</head>
